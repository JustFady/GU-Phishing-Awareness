<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gonzaga Phishing Awareness</title>
  <link rel="icon" href="assets/public-favicon.ico">
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="site-shell login-simulation">
  <header class="institutional-header">
    <img src="assets/logo-microclimate-gonzaga-university.png" alt="Gonzaga University">
  </header>

  <main class="main-panel">
    <section class="login-box" aria-labelledby="page-title">
      <p class="system-label">Gonzaga Account Services</p>
      <h1 id="page-title">Change your password</h1>
      <p class="intro">Enter your Gonzaga account information to continue with the required password update.</p>

      <form id="training-form" class="training-form" action="success.html" method="get">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="username@gonzaga.edu" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="currentPassword">Most Recent Password</label>
          <input type="password" id="currentPassword" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" autocomplete="off" required>
        </div>

        <button type="submit">Submit</button>
      </form>
      <div class="support-links" aria-label="Support links">
        <a href="success.html">Account help</a>
        <a href="logs.html">Security notice</a>
      </div>
    </section>
  </main>

  <footer class="institutional-footer">
    <span>©2026 Gonzaga University</span>
    <a href="logs.html">Privacy</a>
    <a href="logs.html">Terms</a>
    <a href="logs.html">Support</a>
  </footer>

  <script>
    document.getElementById("training-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const form = event.currentTarget;
      const email = form.email.value.trim();
      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const maskSecret = (value) => value ? "*".repeat(Math.min(value.length, 24)) : "";

      sessionStorage.setItem("simulationResult", JSON.stringify({
        schemaVersion: 2,
        email,
        submittedAt: new Date().toLocaleString(),
        currentPassword: `${maskSecret(currentPassword)} (${currentPassword.length} characters, raw value hidden)`,
        newPassword: `${maskSecret(newPassword)} (${newPassword.length} characters, raw value hidden)`,
        confirmPassword: `${maskSecret(confirmPassword)} (${confirmPassword.length} characters, raw value hidden)`,
        passwordMatch: newPassword === confirmPassword ? "Yes" : "No",
        passwordPolicySignal: newPassword.length >= 12 ? "12+ characters" : "Under 12 characters",
        userAgent: navigator.userAgent,
        platform: navigator.platform || "Unavailable",
        language: navigator.language || "Unavailable",
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Unavailable",
        screen: `${window.screen.width} x ${window.screen.height}`,
        viewport: `${window.innerWidth} x ${window.innerHeight}`,
        colorDepth: `${window.screen.colorDepth}-bit`,
        deviceMemory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Unavailable",
        cpuCores: navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency}` : "Unavailable",
        referrer: document.referrer || "Direct visit / unavailable",
        pageUrl: window.location.href,
        cookiesEnabled: navigator.cookieEnabled ? "Yes" : "No",
        online: navigator.onLine ? "Yes" : "No",
        publicIp: "Checking from result page",
        macAddress: "Unavailable to websites by browser design"
      }));

      window.location.href = "success.html";
    });
  </script>
</body>
</html>
